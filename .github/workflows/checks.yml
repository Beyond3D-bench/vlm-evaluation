name: CPU checks
on: [push, pull_request]
jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest -q test/reproducibility
      - run: python tools/validate_dataset.py examples/prepared_dataset.jsonl --schema-only
      - run: for script in launchers/*.sh launchers/models/*.sh; do bash -n "$script"; done
